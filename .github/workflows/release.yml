name: Release

on:
  push:
    tags: ['v*']

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: write
  packages: write
  id-token: write  # Trusted Publishing: OIDC token exchanged for a one-hour nuget.org key

jobs:
  release:
    runs-on: ubuntu-latest

    # Job-level env so that the secret is visible in step-level `if:`
    # expressions (the `secrets` context is not directly available there).
    # Empty string when not set → `env.X != ''` gates skip cleanly.

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Akka.Surgewave.slnx

      - name: Build & Test
        run: |
          dotnet build Akka.Surgewave.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.VERSION }}
          # The Akka.Persistence TCK + EndToEnd tests need a Surgewave broker.
          # Filter via FullyQualifiedName so that release tags don't block.
          # The main CI runs the specs in a separate Testcontainers job
          # (to follow).
          dotnet test --solution Akka.Surgewave.slnx -c Release --no-build -v normal --filter "FullyQualifiedName!~Spec&FullyQualifiedName!~EndToEnd"

      - name: Pack NuGet
        run: dotnet pack Akka.Surgewave.slnx -c Release --no-build -o artifacts/packages -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Publish NuGet to GitHub Packages
        if: ${{ !contains(github.ref, '-rc') }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source "https://nuget.pkg.github.com/Kuestenlogik/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # nuget.org, through Trusted Publishing (no stored key): the policy on
      # nuget.org trusts this repository's release.yml. Only GA tags, no `-rc`.
      # The temporary key lives one hour, so it is fetched right before the push.
      - name: nuget.org login (OIDC → temporary API key)
        if: ${{ !contains(github.ref, '-rc') && vars.NUGET_USER != '' }}
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet to nuget.org
        if: ${{ !contains(github.ref, '-rc') && vars.NUGET_USER != '' }}
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') }}
          files: |
            artifacts/packages/*.nupkg
